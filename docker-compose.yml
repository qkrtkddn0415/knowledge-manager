services:
  backend:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./deploy/.env
    environment:
      DATABASE_URL: sqlite:////app/runtime/database.db
      DATA_DIR: /app/runtime/data
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ${SECOND_BRAIN_RUNTIME_PATH:-second_brain_runtime}:/app/runtime
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  mcp:
    profiles: [mcp]
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./deploy/.env
    environment:
      DATABASE_URL: sqlite:////app/runtime/database.db
      DATA_DIR: /app/runtime/data
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ${SECOND_BRAIN_RUNTIME_PATH:-second_brain_runtime}:/app/runtime
    entrypoint: ["/app/mcp-entrypoint.sh"]
    stdin_open: true

volumes:
  second_brain_runtime:
